<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | absolute_url }}">
    <script>
        window.location.replace("{{ page.redirect_to | absolute_url }}");
    </script>
</head>
<body>
<p>Redirecting to <a href="{{ page.redirect_to | absolute_url }}">{{ page.redirect_to | absolute_url }}</a>.</p>
</body>
</html>
