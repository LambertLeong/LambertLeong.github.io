# Site
title: Lambert Leong
name: Lambert Leong
url: https://www.lambertleong.com
locale: en_US
description: Writing, projects, photography, and healthcare AI by Lambert Leong
meta_description: Writing, projects, photography, and healthcare AI by Lambert Leong, featuring applied machine learning, foundation models, medical imaging, and healthcare AI research.
favicon: /assets/images/landing_page/favicon.ico
paginate: 9
baseurl:
# Keep local scratch environments, private drafts and experiment caches out of
# generated site copies and file watching. Originals remain available locally.
exclude:
  - AGENTS.md
  - writing_style_guide.md
  - .cursor/
  - .gemini/
  - vendor/bundle/
  - "_tmp"
  - "_drafts_codex"
  - "assets/notebooks/jev-from-scratch/results/keep-vlm-comparison-20261023/native-cache"
  - "assets/notebooks/jev-from-scratch/history"
  - "assets/notebooks/jev-from-scratch/results/keep-tutorial-run*/per-image-predictions.jsonl.gz"
# Preserve the generated local review page across builds; its source stays private.
keep_files:
  - ".git"
  - ".svn"
  - "_tmp/keep-followup-review"
email: 'leonglambert@gmail.com'
google_analytics: UA-121492082-1
disqus: lambertleong
sharethis: leonglambert@gmail.com

# Authors
authors:
  Lambert:
    name: Lambert Leong
    display_name: Lambert Leong
    image: /assets/images/lambert_prof_2023.png
    thumb_image: /assets/images/home/lambert_prof_2023_160.webp
    email: leonglambert@gmail.com
    web: https://www.lambertleong.com
    twitter: leonglambert
    description: Hi, I am Lambert Leong, PhD. I build health AI systems spanning foundation models, generative AI evaluation, medical imaging, and applied machine learning research.

