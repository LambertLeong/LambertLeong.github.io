<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Structured decision routing</title><desc id="desc">A routing system scores an explicit set of candidate routes, applies a threshold and abstention policy, then deterministically executes or escalates.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif}.label{font-size:20px;font-weight:700}.small{font-size:15px;fill:#475569}.mono{font-family:monospace;font-size:13px;letter-spacing:1px;fill:#475569}.mono-light{font-family:monospace;font-size:13px;letter-spacing:1px;fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.line{stroke:#475569;stroke-width:4;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="80" font-size="46" font-weight="700">Structured decision routing</text><text x="80" y="120" class="small" font-size="24">Make the route decision explicit, inspectable, and policy-controlled.</text>
  <g transform="translate(70 290)"><rect class="box" rx="15" width="190" height="190"/><text x="95" y="43" text-anchor="middle" class="mono">INPUT STATE</text><rect x="20" y="65" width="150" height="43" rx="6" fill="#f8fafc"/><text x="35" y="91" class="label">Request</text><rect x="20" y="122" width="150" height="43" rx="6" fill="#f8fafc"/><text x="35" y="148" class="label">Program state</text></g><line class="line" x1="275" y1="385" x2="345" y2="385"/>
  <g transform="translate(365 270)"><rect class="box" rx="15" width="210" height="230"/><text x="105" y="40" text-anchor="middle" class="mono">CANDIDATE ROUTES</text><g font-size="17"><rect x="25" y="62" width="160" height="28" rx="14" fill="#e2e8f0"/><text x="105" y="82" text-anchor="middle">retrieval</text><rect x="25" y="103" width="160" height="28" rx="14" fill="#e2e8f0"/><text x="105" y="123" text-anchor="middle">billing</text><rect x="25" y="144" width="160" height="28" rx="14" fill="#e2e8f0"/><text x="105" y="164" text-anchor="middle">security</text><rect x="25" y="185" width="160" height="28" rx="14" fill="#e2e8f0"/><text x="105" y="205" text-anchor="middle">human review</text></g></g><line class="line" x1="590" y1="385" x2="660" y2="385"/>
  <g transform="translate(680 245)"><rect rx="18" width="255" height="280" fill="#002b5b"/><text x="128" y="42" text-anchor="middle" class="mono-light">TYPED CHOICE &amp; SCORES</text><g font-size="16" fill="#fff"><text x="25" y="88" fill="#fff">security</text><text x="222" y="88" text-anchor="end" fill="#fff">0.82</text><rect x="25" y="100" width="200" height="10" rx="5" fill="#1e3a5f"/><rect x="25" y="100" width="164" height="10" rx="5" fill="#93c5fd"/><text x="25" y="143" fill="#fff">billing</text><text x="222" y="143" text-anchor="end" fill="#fff">0.11</text><rect x="25" y="155" width="200" height="10" rx="5" fill="#1e3a5f"/><rect x="25" y="155" width="22" height="10" rx="5" fill="#93c5fd"/><text x="25" y="198" fill="#fff">retrieval</text><text x="222" y="198" text-anchor="end" fill="#fff">0.05</text><rect x="25" y="210" width="200" height="10" rx="5" fill="#1e3a5f"/><rect x="25" y="210" width="10" height="10" rx="5" fill="#93c5fd"/><text x="25" y="253" fill="#fff">human review</text><text x="222" y="253" text-anchor="end" fill="#fff">0.02</text></g></g><line class="line" x1="950" y1="385" x2="1020" y2="385"/>
  <g transform="translate(1040 295)"><rect rx="15" width="235" height="180" fill="#fff9e6" stroke="#d9a000" stroke-width="3"/><text x="117" y="42" text-anchor="middle" class="mono">THRESHOLD POLICY</text><text x="117" y="85" text-anchor="middle" class="label">confidence ≥ 0.80</text><text x="117" y="118" text-anchor="middle" class="small">Proceed when policy allows.</text><text x="117" y="145" text-anchor="middle" class="small">Otherwise abstain / escalate.</text></g>
  <path d="M1290 385H1340V285H1400" class="line" fill="none"/><path d="M1290 385H1340V510H1400" class="line" fill="none"/><g transform="translate(1410 220)"><rect width="150" height="130" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="75" y="38" text-anchor="middle" class="mono">HIGH CONFIDENCE</text><text x="75" y="75" text-anchor="middle" class="label">Specialist agent</text><text x="75" y="102" text-anchor="middle" class="label">or tool</text></g><g transform="translate(1410 455)"><rect width="150" height="130" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 7"/><text x="75" y="35" text-anchor="middle" class="mono">LOW CONFIDENCE</text><text x="75" y="72" text-anchor="middle" class="label">Human review</text><text x="75" y="99" text-anchor="middle" class="label">or planner</text></g>
  <path d="M1460 650V730H220V650" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="700" width="600" height="58" rx="29" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="800" y="736" text-anchor="middle" font-size="17" font-weight="700">Evaluation feedback: accuracy · calibration · latency · cost</text>
</svg>
