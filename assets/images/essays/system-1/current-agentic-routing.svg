<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Current agentic routing</title><desc id="desc">A sequential decoder language-model router produces a route, tool call, or plan, which must then be parsed and validated before execution.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#475569"/></marker><style>text{font-family:Arial,sans-serif}.label{font-size:21px;font-weight:700}.small{font-size:16px;fill:#475569}.mono{font-family:monospace;font-size:14px;letter-spacing:1px;fill:#475569}.mono-light{font-family:monospace;font-size:14px;letter-spacing:1px;fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.line{stroke:#475569;stroke-width:4;marker-end:url(#arrow)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="80" y="80" font-size="46" font-weight="700">Current agentic routing</text><text x="80" y="120" class="small" font-size="24">A generative model is often asked to emit a small routing decision.</text>
  <g transform="translate(80 315)"><rect class="box" rx="16" width="210" height="150"/><text x="105" y="55" text-anchor="middle" class="mono">INPUT</text><text x="105" y="90" text-anchor="middle" class="label">Incoming request</text><text x="105" y="118" text-anchor="middle" class="label">and state</text></g>
  <line class="line" x1="305" y1="390" x2="410" y2="390"/><g transform="translate(430 300)"><rect rx="18" width="245" height="180" fill="#0f172a"/><text x="122" y="60" text-anchor="middle" class="mono-light">CORE LOGIC</text><text x="122" y="105" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Decoder LLM</text><text x="122" y="137" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">router</text></g><rect x="450" y="200" width="205" height="65" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="552" y="228" text-anchor="middle" class="mono">ARCHITECTURE</text><text x="552" y="250" text-anchor="middle" class="small">Sequential token generation</text>
  <line class="line" x1="690" y1="390" x2="795" y2="390"/><g transform="translate(815 315)"><rect class="box" rx="16" width="235" height="150" stroke-dasharray="10 8"/><text x="117" y="52" text-anchor="middle" class="mono">GENERATED OUTPUT</text><text x="117" y="90" text-anchor="middle" class="label">Route, tool call,</text><text x="117" y="118" text-anchor="middle" class="label">or plan</text></g>
  <line class="line" x1="1065" y1="390" x2="1170" y2="390"/><g transform="translate(1190 315)"><rect rx="16" width="225" height="150" fill="#fff6dd" stroke="#d99717" stroke-width="3"/><text x="112" y="52" text-anchor="middle" class="mono">SAFETY &amp; FORMAT</text><text x="112" y="102" text-anchor="middle" class="label">Parse and validate</text></g><rect x="1190" y="505" width="225" height="78" rx="10" fill="#fff0f2" stroke="#fb7185" stroke-width="2"/><text x="1302" y="535" text-anchor="middle" class="mono">EXCEPTION PATH</text><text x="1302" y="560" text-anchor="middle" class="small">Errors, invalid choices, retries</text>
  <path d="M810 280V215Q810 180 850 180H1380Q1420 180 1420 220V270" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 8"/><rect x="1015" y="145" width="165" height="48" rx="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="1097" y="176" text-anchor="middle" font-size="18" font-weight="700">ORCHESTRATOR</text><text x="1025" y="224" class="mono">sequence · shared state · retries</text>
  <path d="M550 500V605Q550 650 600 650H1070Q1110 650 1110 600V500" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/><rect x="760" y="628" width="145" height="46" rx="23" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="832" y="657" text-anchor="middle" font-size="17" font-weight="700">PLANNER</text><text x="620" y="615" class="mono">multi-step plan feed</text>
  <text x="80" y="820" class="small">Generation is flexible, but a fixed routing decision may still require output handling and repair.</text>
</svg>
